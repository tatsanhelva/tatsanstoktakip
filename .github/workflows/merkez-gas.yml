name: TATSAN Merkezi - Google Baglanti Testi

# This repository serves a PUBLIC GitHub Pages site.
# NEVER sync Apps Script source code or OAuth credentials into this repository.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baglanti:
    name: Apps Script baglantisini dogrula - salt okuma
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Node.js hazirla
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Google Apps Script istemcisini kur
        run: npm install --global @google/clasp@3.4.1

      - name: Baglantiyi test et - uzaktaki projede hicbir degisiklik yapmaz
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CLASPRC_JSON" || -z "$GAS_SCRIPT_ID" ]]; then
            echo 'Eksik secret: CLASPRC_JSON veya GAS_SCRIPT_ID' >&2
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          mkdir -p "$RUNNER_TEMP/tatsan-check"
          cd "$RUNNER_TEMP/tatsan-check"
          node -e "const fs=require('fs');fs.writeFileSync('.clasp.json',JSON.stringify({scriptId:process.env.GAS_SCRIPT_ID}))"
          if ! clasp pull >/dev/null 2>&1; then
            echo 'Google Apps Script baglantisi basarisiz. API ayari, OAuth yetkisi veya Script ID kontrol edilmeli.' >&2
            exit 1
          fi
          shopt -s nullglob
          codefiles=(*.js *.gs)
          if (( ${#codefiles[@]} == 0 )); then
            echo 'Proje erisilebilir ancak kaynak kod dosyasi yok.' >&2
            exit 1
          fi
          if ! grep -Eq 'function[[:space:]]+setupMerkez' "${codefiles[@]}"; then
            echo 'Baglanildi, ancak beklenen TATSAN merkezi kodu bulunamadi. Yanlis Script ID olabilir.' >&2
            exit 1
          fi
          if ! grep -Eq 'function[[:space:]]+stockSandboxOperation_' "${codefiles[@]}"; then
            echo 'Baglanildi, ancak sandbox islem islevi bulunamadi. Script ID/versiyon kontrol edilmeli.' >&2
            exit 1
          fi
          echo 'BASARILI: Google Apps Script proje baglantisi dogrulandi.'
          echo 'Bu test yalnizca okudu. GitHub deposuna kod yuklenmedi, Apps Script degistirilmedi.'
